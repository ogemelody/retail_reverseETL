version: 2

models:
  - name: stg_ecommerce_customers
    description: Typed, source-shaped ecommerce customer observations from LANDING.
    columns:
      - name: source_record_id
        description: Source-native ecommerce customer record identifier.
        data_tests: [not_null]
      - name: source_system
        description: Source system that produced the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['ecommerce']}
      - name: source_entity
        description: Source entity represented by the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['customers']}
      - name: operation
        description: Source change operation.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['insert', 'update', 'delete']}
      - name: business_event_timestamp
        description: Timestamp associated with the source business event.
        data_tests: [not_null]
      - name: source_updated_at
        description: Timestamp when the source record was updated.
        data_tests: [not_null]
      - name: ingestion_timestamp
        description: Timestamp when the source observation entered ingestion.
        data_tests: [not_null]
      - name: late_arrival
        description: Whether the observation arrived later than the configured threshold.
        data_tests: [not_null]
      - name: late_arrival_reason
        description: Optional reason supplied for late arrival.
      - name: batch_id
        description: Batch that delivered the observation.
        data_tests: [not_null]
      - name: schema_version
        description: Ecommerce customer source schema version.
        data_tests: [not_null]
      - name: ecommerce_customer_id
        description: Ecommerce-native customer identifier.
        data_tests: [not_null]
      - name: email_hash
        description: Normalized email hash when available from the ecommerce source.
      - name: first_name
        description: Customer first name from the ecommerce source.
      - name: last_name
        description: Customer last name from the ecommerce source.
      - name: city
        description: Customer city when present in the source record.
      - name: source_file
        description: Landing file from which Snowflake loaded the record.
        data_tests: [not_null]
      - name: source_file_row
        description: Row number within the landing file.
        data_tests: [not_null]
      - name: warehouse_loaded_at
        description: Timestamp when Snowflake loaded the landing record.
        data_tests: [not_null]

