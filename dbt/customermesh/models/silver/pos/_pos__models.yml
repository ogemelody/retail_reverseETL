version: 2

models:
  - name: stg_pos_transactions
    description: Typed, source-shaped POS transaction observations from LANDING.
    columns:
      - name: source_record_id
        description: Source-native POS transaction identifier.
        data_tests: [not_null]
      - name: source_system
        description: Source system that produced the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['pos']}
      - name: source_entity
        description: Source entity represented by the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['transactions']}
      - name: operation
        description: Source change operation.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['insert', 'update', 'delete']}
      - name: business_event_timestamp
        description: Timestamp associated with the POS transaction.
        data_tests: [not_null]
      - name: source_updated_at
        description: Timestamp when the source record was updated.
        data_tests: [not_null]
      - name: ingestion_timestamp
        description: Timestamp when the source observation entered ingestion.
        data_tests: [not_null]
      - name: late_arrival
        description: Whether the observation arrived late.
        data_tests: [not_null]
      - name: late_arrival_reason
        description: Optional reason supplied for late arrival.
      - name: batch_id
        description: Batch that delivered the observation.
        data_tests: [not_null]
      - name: schema_version
        description: POS transaction source schema version.
        data_tests: [not_null]
      - name: store_id
        description: Source store identifier.
        data_tests: [not_null]
      - name: product_id
        description: Source product identifier.
        data_tests: [not_null]
      - name: amount
        description: Transaction amount in the source currency.
        data_tests: [not_null]
      - name: currency
        description: Currency code for the transaction amount.
        data_tests: [not_null]
      - name: loyalty_id
        description: Optional source loyalty identifier available at checkout.
      - name: source_file
        description: Landing file from which Snowflake loaded the record.
        data_tests: [not_null]
      - name: source_file_row
        description: Row number within the landing file.
        data_tests: [not_null]
      - name: warehouse_loaded_at
        description: Timestamp when Snowflake loaded the landing record.
        data_tests: [not_null]

  - name: stg_pos_returns
    description: Typed, source-shaped POS return observations from LANDING.
    columns:
      - name: source_record_id
        description: Source-native POS return identifier.
        data_tests: [not_null]
      - name: source_system
        description: Source system that produced the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['pos']}
      - name: source_entity
        description: Source entity represented by the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['returns']}
      - name: operation
        description: Source change operation.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['insert', 'update', 'delete']}
      - name: business_event_timestamp
        description: Timestamp associated with the POS return.
        data_tests: [not_null]
      - name: source_updated_at
        description: Timestamp when the source record was updated.
        data_tests: [not_null]
      - name: ingestion_timestamp
        description: Timestamp when the source observation entered ingestion.
        data_tests: [not_null]
      - name: late_arrival
        description: Whether the observation arrived late.
        data_tests: [not_null]
      - name: late_arrival_reason
        description: Optional reason supplied for late arrival.
      - name: batch_id
        description: Batch that delivered the observation.
        data_tests: [not_null]
      - name: schema_version
        description: POS return source schema version.
        data_tests: [not_null]
      - name: store_id
        description: Source store identifier.
        data_tests: [not_null]
      - name: product_id
        description: Source product identifier.
        data_tests: [not_null]
      - name: amount
        description: Returned amount in the source currency.
        data_tests: [not_null]
      - name: currency
        description: Currency code for the returned amount.
        data_tests: [not_null]
      - name: loyalty_id
        description: Optional source loyalty identifier available at checkout.
      - name: return_of_transaction_id
        description: Source transaction identifier referenced by the return.
        data_tests: [not_null]
      - name: return_type
        description: Source return classification.
        data_tests: [not_null]
      - name: source_file
        description: Landing file from which Snowflake loaded the record.
        data_tests: [not_null]
      - name: source_file_row
        description: Row number within the landing file.
        data_tests: [not_null]
      - name: warehouse_loaded_at
        description: Timestamp when Snowflake loaded the landing record.
        data_tests: [not_null]
